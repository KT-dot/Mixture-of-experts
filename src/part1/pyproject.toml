[project]
name = "anlp-assignment2-part1"
version = "0.1.0"
description = "Notebook experiments for five decoder-only translation FFN variants"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.6.0",
  "datasets==5.0.1",
  "tokenizers==0.23.2",
  "numpy==2.5.3",
  "pandas==3.0.5",
  "matplotlib==3.11.2",
  "sacrebleu==2.6.0",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<0.12",
  "ipykernel>=6,<8",
  "ipython>=9,<10",
  "papermill>=2.6,<3",
  "huggingface-hub>=1,<2",
]
[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
